# ==========================================================
# Template konfigurasi Nginx untuk HidroKu (reverse proxy)
# ==========================================================
# Cara pakai (di VPS, jalankan dengan sudo):
#   1. GANTI "hidroku.example.com" dengan domain/subdomain kamu.
#   2. Copy ke Nginx:    sudo cp deploy/nginx.conf /etc/nginx/sites-available/hidroku
#   3. Aktifkan:         sudo ln -s /etc/nginx/sites-available/hidroku /etc/nginx/sites-enabled/
#   4. Tes konfigurasi:  sudo nginx -t
#   5. Reload:           sudo systemctl reload nginx
#   (Setelah ini pasang HTTPS dengan Certbot — lihat bagian Deploy di README)
# ----------------------------------------------------------

server {
    listen 80;
    server_name hidroku.example.com;   # GANTI dengan domainmu

    # GANTI bila folder proyek berbeda (harus sama dengan WorkingDirectory systemd)
    root /home/hidro/hidroku;

    # Batas ukuran request, disamakan dengan MAX_CONTENT_LENGTH di app.py (1 MB)
    client_max_body_size 1m;

    # File statis (CSS/JS/gambar) dilayani langsung oleh Nginx -> lebih cepat
    location /static/ {
        alias /home/hidro/hidroku/static/;
        expires 7d;
        access_log off;
    }

    # Sisanya diteruskan ke gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
